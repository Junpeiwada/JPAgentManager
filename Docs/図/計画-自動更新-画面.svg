<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="18" font-weight="bold" fill="#202124">「更新を確認…」の置き場所</text>

  <!-- ===== 左: パネルのフッター ===== -->
  <text x="24" y="72" font-size="14" font-weight="bold" fill="#202124">① パネルのフッター（左クリックで開くパネルの下端）</text>
  <!-- パネルの外枠（既存） -->
  <rect x="24" y="88" width="448" height="200" rx="24" fill="#F1F3F4" stroke="#80868B" stroke-width="2"/>
  <text x="48" y="120" font-size="12" fill="#5F6368">（リポジトリのフォルダが並ぶ部分。変えない）</text>
  <rect x="48" y="136" width="400" height="28" rx="8" fill="#FFFFFF" stroke="#80868B" stroke-opacity="0.4"/>
  <rect x="48" y="176" width="400" height="28" rx="8" fill="#FFFFFF" stroke="#80868B" stroke-opacity="0.4"/>
  <line x1="40" y1="232" x2="456" y2="232" stroke="#80868B" stroke-opacity="0.4"/>
  <!-- フッターの中身 -->
  <text x="48" y="262" font-size="13" fill="#9AA0A6">設定…</text>
  <rect x="200" y="244" width="200" height="28" rx="6" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="212" y="262" font-size="12" fill="#5F6368">v0.1.1</text>
  <text x="300" y="262" font-size="13" fill="#202124" text-anchor="middle">更新を確認…</text>
  <text x="448" y="262" font-size="13" fill="#202124" text-anchor="end">終了</text>

  <line x1="300" y1="272" x2="300" y2="320" stroke="#80868B"/>
  <text x="24" y="340" font-size="12" fill="#5F6368">青枠が追加分。版数は小さく補足色で、「更新を確認…」は「終了」と同じ文字ボタン。</text>
  <text x="24" y="358" font-size="12" fill="#5F6368">押すとパネルを閉じてから Sparkle の確認ダイアログを出す。</text>
  <text x="24" y="376" font-size="12" fill="#5F6368">「設定…」は今までどおり無効のまま。</text>

  <!-- ===== 右: 右クリックメニュー ===== -->
  <text x="520" y="72" font-size="14" font-weight="bold" fill="#202124">② 右クリックメニュー</text>
  <!-- メニューバー（既存） -->
  <rect x="520" y="88" width="336" height="28" fill="#F1F3F4" stroke="#80868B" stroke-width="2"/>
  <circle cx="704" cy="102" r="4.5" fill="#FF9500"/>
  <text x="712" y="107" font-size="12" font-weight="bold" fill="#202124">1</text>
  <circle cx="732" cy="102" r="4.5" fill="#007AFF"/>
  <text x="740" y="107" font-size="12" font-weight="bold" fill="#202124">2</text>
  <text x="756" y="107" font-size="11" fill="#5F6368">/ 8</text>
  <!-- メニュー（新規） -->
  <rect x="688" y="124" width="168" height="128" rx="8" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="704" y="150" font-size="12" fill="#9AA0A6">JPAgentManager v0.1.1</text>
  <line x1="696" y1="164" x2="848" y2="164" stroke="#80868B" stroke-opacity="0.5"/>
  <text x="704" y="190" font-size="13" fill="#202124">更新を確認…</text>
  <line x1="696" y1="206" x2="848" y2="206" stroke="#80868B" stroke-opacity="0.5"/>
  <text x="704" y="232" font-size="13" fill="#202124">終了</text>

  <line x1="688" y1="102" x2="604" y2="152" stroke="#80868B"/>
  <text x="528" y="168" font-size="12" fill="#5F6368">右クリック</text>
  <text x="528" y="184" font-size="12" fill="#5F6368">（control＋クリック）</text>
  <text x="528" y="200" font-size="12" fill="#5F6368">でメニュー。</text>
  <text x="528" y="216" font-size="12" fill="#5F6368">左クリックは今までどおり</text>
  <text x="528" y="232" font-size="12" fill="#5F6368">パネルを開閉。</text>
  <text x="520" y="340" font-size="12" fill="#5F6368">先頭の行は版数の表示だけ（押せない）。</text>
  <text x="520" y="358" font-size="12" fill="#5F6368">開いていたパネルは、メニューを出す前に閉じる。</text>

  <!-- 凡例 -->
  <rect x="24" y="408" width="16" height="16" fill="#E8F0FE" stroke="#3B6FD8"/>
  <text x="48" y="421" font-size="12" fill="#5F6368">この計画で足すもの</text>
  <rect x="192" y="408" width="16" height="16" fill="#F1F3F4" stroke="#80868B"/>
  <text x="216" y="421" font-size="12" fill="#5F6368">既にあるもの</text>
</svg>
