<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFD3EC"/>
      <stop offset="0.55" stop-color="#D8D0EC"/>
      <stop offset="1" stop-color="#EED9CF"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E143C" flood-opacity="0.25"/>
    </filter>
    <!-- フォルダの本体: 耳の付く左上だけ角を立てる -->
    <clipPath id="body1"><path d="M282 110 H772 a16 16 0 0 1 16 16 V262 a16 16 0 0 1 -16 16 H298 a16 16 0 0 1 -16 -16 Z"/></clipPath>
    <clipPath id="body2"><path d="M282 314 H772 a16 16 0 0 1 16 16 V396 a16 16 0 0 1 -16 16 H298 a16 16 0 0 1 -16 -16 Z"/></clipPath>
    <clipPath id="body3"><path d="M282 448 H772 a16 16 0 0 1 16 16 V468 a16 16 0 0 1 -16 16 H298 a16 16 0 0 1 -16 -16 Z"/></clipPath>
  </defs>

  <!-- デスクトップ背景 -->
  <rect width="820" height="700" rx="12" fill="url(#wall)"/>

  <!-- メニューバー -->
  <rect width="820" height="28" fill="#FFFFFF" fill-opacity="0.55"/>
  <text x="16" y="19" font-size="13" font-weight="600" fill="#111">Code</text>
  <text x="62" y="19" font-size="13" fill="#333">ファイル　編集　表示</text>
  <rect x="586" y="4" width="112" height="20" rx="6" fill="#000000" fill-opacity="0.1"/>
  <circle cx="600" cy="14" r="5" fill="none" stroke="#1C1C1E" stroke-width="1.6"/>
  <circle cx="600" cy="14" r="1.6" fill="#1C1C1E"/>
  <circle cx="618" cy="14" r="4.5" fill="#FF9500"/>
  <text x="626" y="19" font-size="12" font-weight="700" fill="#1C1C1E">1</text>
  <circle cx="642" cy="14" r="4.5" fill="#007AFF"/>
  <text x="650" y="19" font-size="12" font-weight="700" fill="#1C1C1E">2</text>
  <text x="666" y="19" font-size="11" fill="#48484A">/ 8</text>
  <text x="766" y="19" font-size="12" fill="#333" text-anchor="end">10:42</text>

  <!-- ドロップダウン（すりガラスのパネル） -->
  <g filter="url(#sh)">
    <rect x="270" y="36" width="530" height="570" rx="24" fill="#F6F6FA" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.7"/>
  </g>
  <text x="288" y="67" font-size="17" font-weight="700" fill="#1C1C1E">Claude</text>
  <!-- 集計（ガラスのカプセル） -->
  <rect x="560" y="52" width="84" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.75"/>
  <circle cx="572" cy="62" r="3.5" fill="#FF9500"/>
  <text x="580" y="66" font-size="11" font-weight="600" fill="#1C1C1E">許可待ち 1</text>
  <rect x="650" y="52" width="72" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.75"/>
  <circle cx="662" cy="62" r="3.5" fill="#007AFF"/>
  <text x="670" y="66" font-size="11" font-weight="600" fill="#1C1C1E">実行中 2</text>
  <rect x="728" y="52" width="54" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.75"/>
  <text x="755" y="66" font-size="11" font-weight="600" fill="#1C1C1E" text-anchor="middle">タブ 8</text>

  <!-- ===== フォルダ: PhotoSorter（紫） ===== -->
  <path d="M282 110 V97 a11 11 0 0 1 11 -11 H451 a11 11 0 0 1 11 11 V110 Z" fill="#AF52DE"/>
  <text x="294" y="103" font-size="12" font-weight="700" fill="#FFFFFF">PhotoSorter</text>
  <rect x="404" y="90" width="18" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.28"/>
  <text x="413" y="102" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="432" cy="98" r="3" fill="#FFD60A"/><circle cx="441" cy="98" r="3" fill="#FFFFFF"/><circle cx="450" cy="98" r="3" fill="#FFFFFF" fill-opacity="0.45"/>
  <g clip-path="url(#body1)">
    <rect x="282" y="110" width="506" height="168" fill="#FFFFFF"/>
    <rect x="282" y="110" width="506" height="3" fill="#AF52DE"/>
  </g>

  <!-- タブ1: 許可待ち（行を橙に塗る・ホバー中） -->
  <rect x="286" y="117" width="498" height="62" rx="12" fill="#FF9500" fill-opacity="0.14"/>
  <text x="296" y="137" font-size="13" font-weight="600" fill="#1C1C1E">写真選別画面にお気に入りフィルタを追加</text>
  <rect x="696" y="125" width="80" height="17" rx="8.5" fill="#FF9500"/>
  <text x="736" y="137" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">許可待ち 2分</text>
  <text x="296" y="155" font-size="11" fill="#8E8E93">直近</text>
  <text x="322" y="155" font-size="11" fill="#6E6E73">Bash: npm run tauri build</text>
  <text x="296" y="171" font-size="11" fill="#8E8E93">指示</text>
  <text x="322" y="171" font-size="11" fill="#A35A00">「フィルタの状態を localStorage に保存して」</text>
  <path d="M610 152 l0 16 l4 -4 l3 7 l3 -1 l-3 -7 l6 0 z" fill="#111" stroke="#fff" stroke-width="1"/>

  <!-- タブ2: 実行中 -->
  <text x="296" y="204" font-size="13" font-weight="600" fill="#1C1C1E">画像補正パラメータの比較実験</text>
  <rect x="706" y="192" width="70" height="17" rx="8.5" fill="#007AFF" fill-opacity="0.14"/>
  <text x="741" y="204" font-size="10.5" font-weight="600" fill="#007AFF" text-anchor="middle">実行中 0:45</text>
  <text x="296" y="222" font-size="11" fill="#8E8E93">直近</text>
  <text x="322" y="222" font-size="11" fill="#6E6E73">Edit: src/filter/config.ts</text>
  <line x1="296" y1="231" x2="788" y2="231" stroke="#3C3C43" stroke-opacity="0.14"/>

  <!-- タブ3: 待機 -->
  <text x="296" y="250" font-size="13" fill="#6E6E73">README の手順を新UIに合わせて更新</text>
  <rect x="710" y="238" width="66" height="17" rx="8.5" fill="#8E8E93" fill-opacity="0.14"/>
  <text x="743" y="250" font-size="10.5" font-weight="600" fill="#6E6E73" text-anchor="middle">待機 25分</text>
  <text x="296" y="268" font-size="11" fill="#8E8E93">直近</text>
  <text x="322" y="268" font-size="11" fill="#6E6E73">返答済み（Write: README.md）</text>

  <!-- ===== フォルダ: Notebook（ミント） ===== -->
  <path d="M282 314 V301 a11 11 0 0 1 11 -11 H399 a11 11 0 0 1 11 11 V314 Z" fill="#00A89F"/>
  <text x="294" y="307" font-size="12" font-weight="700" fill="#FFFFFF">Notebook</text>
  <rect x="362" y="294" width="18" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.28"/>
  <text x="371" y="306" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="390" cy="302" r="3" fill="#FFFFFF"/><circle cx="399" cy="302" r="3" fill="#FFFFFF" fill-opacity="0.45"/>
  <g clip-path="url(#body2)">
    <rect x="282" y="314" width="506" height="98" fill="#FFFFFF"/>
    <rect x="282" y="314" width="506" height="3" fill="#00A89F"/>
  </g>

  <text x="296" y="338" font-size="13" font-weight="600" fill="#1C1C1E">複数Macのエージェント統合ビュー</text>
  <rect x="706" y="326" width="70" height="17" rx="8.5" fill="#007AFF" fill-opacity="0.14"/>
  <text x="741" y="338" font-size="10.5" font-weight="600" fill="#007AFF" text-anchor="middle">実行中 0:12</text>
  <text x="296" y="356" font-size="11" fill="#8E8E93">直近</text>
  <text x="322" y="356" font-size="11" fill="#6E6E73">Write: 図/案1-メニューバー.svg</text>
  <line x1="296" y1="365" x2="788" y2="365" stroke="#3C3C43" stroke-opacity="0.14"/>

  <text x="296" y="384" font-size="13" fill="#6E6E73">同期スクリプトの dry-run 表示を整理</text>
  <rect x="702" y="372" width="74" height="17" rx="8.5" fill="#8E8E93" fill-opacity="0.14"/>
  <text x="739" y="384" font-size="10.5" font-weight="600" fill="#6E6E73" text-anchor="middle">待機 1時間</text>
  <text x="296" y="402" font-size="11" fill="#8E8E93">直近</text>
  <text x="322" y="402" font-size="11" fill="#6E6E73">返答済み</text>

  <!-- ===== フォルダ: SensorDemo（ブラウン・空のタブだけ） ===== -->
  <path d="M282 448 V435 a11 11 0 0 1 11 -11 H389 a11 11 0 0 1 11 11 V448 Z" fill="#A2845E"/>
  <text x="294" y="441" font-size="12" font-weight="700" fill="#FFFFFF">SensorDemo</text>
  <rect x="362" y="428" width="18" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.28"/>
  <text x="371" y="440" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="390" cy="436" r="2.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1"/>
  <g clip-path="url(#body3)">
    <rect x="282" y="448" width="506" height="36" fill="#FFFFFF"/>
    <rect x="282" y="448" width="506" height="3" fill="#A2845E"/>
  </g>
  <text x="296" y="472" font-size="13" fill="#8E8E93">（新しいタブ・まだ指示なし）</text>
  <rect x="748" y="460" width="28" height="17" rx="8.5" fill="none" stroke="#3C3C43" stroke-opacity="0.2"/>
  <text x="762" y="472" font-size="10.5" font-weight="600" fill="#8E8E93" text-anchor="middle">空</text>

  <!-- 折りたたみ表示（待機だけのフォルダは耳の色だけ並べる） -->
  <rect x="282" y="496" width="506" height="34" rx="14" fill="#FFFFFF" fill-opacity="0.8"/>
  <text x="296" y="517" font-size="12" fill="#6E6E73">› 待機中だけのフォルダ（2）</text>
  <path d="M636 522 V511 a5 5 0 0 1 5 -5 H683 a5 5 0 0 1 5 5 V522 Z" fill="#5856D6"/>
  <text x="662" y="518" font-size="10" fill="#FFFFFF" text-anchor="middle">Viewer</text>
  <path d="M694 522 V511 a5 5 0 0 1 5 -5 H771 a5 5 0 0 1 5 5 V522 Z" fill="#FF2D55"/>
  <text x="735" y="518" font-size="10" fill="#FFFFFF" text-anchor="middle">SoundKit</text>

  <text x="288" y="558" font-size="12" fill="#3A3A3C">☐ 待機中を隠す</text>
  <line x1="282" y1="572" x2="788" y2="572" stroke="#3C3C43" stroke-opacity="0.12"/>
  <text x="288" y="594" font-size="12" fill="#3A3A3C">設定…</text>
  <text x="782" y="594" font-size="12" fill="#3A3A3C" text-anchor="end">終了</text>

  <!-- 凡例と注記（左側） -->
  <text x="20" y="62" font-size="12" font-weight="700" fill="#1F2937">行の読み方</text>
  <text x="20" y="84" font-size="11" fill="#374151">太字 = 目標</text>
  <text x="20" y="100" font-size="11" fill="#4B5563">（セッションのタイトル）</text>
  <text x="20" y="122" font-size="11" fill="#374151">直近 = 最後のツール操作</text>
  <text x="20" y="144" font-size="11" fill="#374151">指示 = 最後に送った指示</text>
  <text x="20" y="160" font-size="11" fill="#4B5563">（許可待ちの行だけ表示）</text>

  <text x="20" y="196" font-size="12" font-weight="700" fill="#1F2937">状態</text>
  <rect x="20" y="206" width="30" height="14" rx="7" fill="#FF9500"/><text x="58" y="218" font-size="11" fill="#374151">許可待ち・入力待ち（行も橙に）</text>
  <rect x="20" y="226" width="30" height="14" rx="7" fill="#007AFF" fill-opacity="0.18"/><text x="58" y="238" font-size="11" fill="#374151">実行中</text>
  <rect x="20" y="246" width="30" height="14" rx="7" fill="#8E8E93" fill-opacity="0.18"/><text x="58" y="258" font-size="11" fill="#374151">待機（返答済み）</text>
  <rect x="20" y="266" width="30" height="14" rx="7" fill="none" stroke="#8E8E93" stroke-opacity="0.6"/><text x="58" y="278" font-size="11" fill="#374151">空のタブ</text>

  <text x="20" y="314" font-size="12" font-weight="700" fill="#1F2937">並び順</text>
  <text x="20" y="334" font-size="11" fill="#374151">リポジトリ単位でまとめ、</text>
  <text x="20" y="350" font-size="11" fill="#374151">許可待ち → 実行中 → 待機</text>
  <text x="20" y="366" font-size="11" fill="#374151">を含む順に上へ</text>

  <text x="20" y="402" font-size="12" font-weight="700" fill="#1F2937">見た目（書類棚・iOS 寄せ）</text>
  <text x="20" y="422" font-size="11" fill="#374151">リポジトリ = 色付きのフォルダ。</text>
  <text x="20" y="438" font-size="11" fill="#374151">左上の耳に名前・タブ数・状態の点</text>
  <text x="20" y="460" font-size="11" fill="#374151">フォルダの色は origin URL から</text>
  <text x="20" y="476" font-size="11" fill="#374151">決める。橙・青は状態色なので使わない</text>
  <text x="20" y="498" font-size="11" fill="#374151">ダークモードは OS に合わせて切替</text>

  <!-- 下部注記 -->
  <text x="270" y="636" font-size="12" fill="#1F2937">行をクリック → ① そのフォルダの VSCode ウィンドウを前面へ</text>
  <text x="270" y="654" font-size="12" fill="#1F2937">　　　　　　　 ② そのセッションの Claude タブを表示</text>
  <text x="270" y="680" font-size="11" fill="#4B5563">メニューバーの数字: 許可待ち 1 ・ 実行中 2 ／ 開いているタブ 8</text>
</svg>
