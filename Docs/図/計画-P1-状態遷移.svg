<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="18" font-weight="bold" fill="#202124">セッションの状態遷移（P1・sessions ファイルの status の変化）</text>

  <!-- 初期 -->
  <circle cx="40" cy="120" r="8" fill="#202124"/>
  <line x1="48" y1="120" x2="68" y2="120" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="24" y="180" font-size="12" fill="#5F6368">sessions ファイルができる</text>

  <!-- 状態 -->
  <rect x="72" y="88" width="144" height="64" rx="24" fill="#F1F3F4" stroke="#80868B" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="144" y="125" font-size="14" fill="#202124" text-anchor="middle">空</text>

  <rect x="360" y="88" width="160" height="64" rx="24" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="440" y="125" font-size="14" fill="#202124" text-anchor="middle">実行中</text>

  <rect x="664" y="88" width="176" height="64" rx="24" fill="#FEF3E2" stroke="#E08A00" stroke-width="2"/>
  <text x="752" y="125" font-size="14" fill="#202124" text-anchor="middle">許可待ち・入力待ち</text>

  <rect x="360" y="280" width="160" height="64" rx="24" fill="#F1F3F4" stroke="#80868B" stroke-width="2"/>
  <text x="440" y="317" font-size="14" fill="#202124" text-anchor="middle">待機</text>

  <rect x="664" y="280" width="176" height="64" rx="8" fill="#FCE8E6" stroke="#D93025" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="752" y="306" font-size="14" fill="#202124" text-anchor="middle">一覧から消える</text>
  <text x="752" y="326" font-size="12" fill="#5F6368" text-anchor="middle">PID 消滅でファイル無効</text>
  <text x="752" y="364" font-size="12" fill="#5F6368" text-anchor="middle">（どの状態からでも）</text>

  <!-- 空 → 実行中 -->
  <line x1="216" y1="120" x2="356" y2="120" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="286" y="110" font-size="12" fill="#5F6368" text-anchor="middle">idle → busy</text>

  <!-- 実行中 → 許可待ち -->
  <line x1="520" y1="108" x2="660" y2="108" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="98" font-size="12" fill="#5F6368" text-anchor="middle">busy → waiting</text>

  <!-- 許可待ち → 実行中 -->
  <line x1="664" y1="136" x2="524" y2="136" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="594" y="156" font-size="12" fill="#5F6368" text-anchor="middle">waiting → busy</text>
  <text x="594" y="172" font-size="12" fill="#5F6368" text-anchor="middle">（許可・回答）</text>

  <!-- 実行中 → 待機 -->
  <line x1="424" y1="152" x2="424" y2="276" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="416" y="214" font-size="12" fill="#5F6368" text-anchor="end">busy → idle</text>

  <!-- 待機 → 実行中 -->
  <line x1="456" y1="280" x2="456" y2="156" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="464" y="222" font-size="12" fill="#5F6368">idle → busy</text>

  <!-- 許可待ち → 待機 -->
  <line x1="700" y1="152" x2="524" y2="292" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="628" y="250" font-size="12" fill="#5F6368">waiting → idle（拒否・中断）</text>

  <!-- 凡例 -->
  <line x1="24" y1="396" x2="56" y2="396" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="68" y="400" font-size="12" fill="#5F6368">status の変化（sessions ファイルの書き換え）</text>
  <rect x="352" y="388" width="24" height="16" rx="4" fill="#F1F3F4" stroke="#80868B" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="384" y="400" font-size="12" fill="#5F6368">会話ログに指示が無い idle</text>
</svg>
