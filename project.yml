name: JPAgentManager
options:
  bundleIdPrefix: com.junpeiwada
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.5"
settings:
  base:
    # Xcode の「推奨設定に更新」に相当する項目（ハードンドランタイムは方針により NO のまま）
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
targets:
  JPAgentManager:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junpeiwada.JPAgentManager
        PRODUCT_NAME: JPAgentManager
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: jpam-hook
        embed: true
        copy:
          destination: executables
  jpam-hook:
    type: tool
    platform: macOS
    sources:
      - path: HookHelper
    settings:
      base:
        PRODUCT_NAME: jpam-hook
        SKIP_INSTALL: YES
  JPAgentManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        optional: true
        buildPhase: resources
    dependencies:
      - target: JPAgentManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junpeiwada.JPAgentManager.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JPAgentManager.app/Contents/MacOS/JPAgentManager"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  JPAgentManager:
    build:
      targets:
        JPAgentManager: all
    test:
      targets:
        - JPAgentManagerTests
