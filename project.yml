name: JPAgentManager
options:
  bundleIdPrefix: com.junpeiwada
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.5"
settings:
  base:
    # Xcode の「推奨設定に更新」に相当する項目
    # ハードンドランタイムは CI のアーカイブ（Developer ID 署名）だけでコマンドラインから有効にする。
    # アドホック署名のまま有効にすると Sparkle をライブラリ検証で読めず起動しない
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
packages:
  # アプリ内自動更新
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 固定する（.xcodeproj は git 管理外で、CI で最新が入るのを防ぐ）。
    # 上げるときは release.yml の generate_appcast の版も一緒に上げる
    exactVersion: "2.9.3"
targets:
  JPAgentManager:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junpeiwada.JPAgentManager
        PRODUCT_NAME: JPAgentManager
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: Sparkle
        product: Sparkle
  jpam-hook:
    type: tool
    platform: macOS
    sources:
      - path: HookHelper
    settings:
      base:
        PRODUCT_NAME: jpam-hook
        SKIP_INSTALL: YES
  JPAgentManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        optional: true
        buildPhase: resources
    dependencies:
      - target: JPAgentManager
      # ビルドだけさせる（テストバンドルへ埋め込まず、リンクもしない）。成果物は .app と同じフォルダに出る
      - target: jpam-hook
        embed: false
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junpeiwada.JPAgentManager.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JPAgentManager.app/Contents/MacOS/JPAgentManager"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  JPAgentManager:
    build:
      targets:
        JPAgentManager: all
    test:
      targets:
        - JPAgentManagerTests
